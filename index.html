<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>চাকরির খোঁজে</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-2">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                চাকরির খোঁজে
            </h1>
            <p id="liveCountBadge" class="text-sm bg-blue-800 px-3 py-1 rounded-full text-center">
                লাইভ আপডেট: লোড হচ্ছে... (WB Govt, Central Govt., Private Sector)
            </p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- Search & Filter Bar -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row gap-4 justify-between items-center border border-slate-200">
            <input type="text" id="searchInput" placeholder="পদ, সংস্থা বা যোগ্যতা দিয়ে খুঁজুন..." 
                class="w-full md:w-1/3 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
            
            <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                <button type="button" onclick="filterCategory('all', this)" class="filter-btn px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold whitespace-nowrap transition">সব চাকরি</button>
                <button type="button" onclick="filterCategory('WB Govt', this)" class="filter-btn px-4 py-2 bg-slate-200 text-slate-700 hover:bg-slate-300 rounded-lg text-sm font-semibold whitespace-nowrap transition">পশ্চিমবঙ্গ সরকার</button>
                <button type="button" onclick="filterCategory('Central Govt', this)" class="filter-btn px-4 py-2 bg-slate-200 text-slate-700 hover:bg-slate-300 rounded-lg text-sm font-semibold whitespace-nowrap transition">কেন্দ্রীয় সরকার</button>
                <button type="button" onclick="filterCategory('Private', this)" class="filter-btn px-4 py-2 bg-slate-200 text-slate-700 hover:bg-slate-300 rounded-lg text-sm font-semibold whitespace-nowrap transition">প্রাইভেট সেক্টর</button>
            </div>
        </div>

        <!-- Job Grid -->
        <div id="jobGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="col-span-full text-center text-slate-500 py-10">ডেটা লোড হচ্ছে...</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-300 text-center py-6 mt-12">
        <p class="text-sm">© ২০২৬ চাকরির খোঁজে — সর্বস্বত্ব সংরক্ষিত</p>
    </footer>

    <!-- Script -->
    <script>
        let jobsData = [];
        const jobGrid = document.getElementById('jobGrid');
        const searchInput = document.getElementById('searchInput');
        const liveCountBadge = document.getElementById('liveCountBadge');
        let currentFilter = 'all';

        /**
         * Remove duplicate jobs caused by repeated daily scraping.
         * Deduplicates by normalized title (post) and applyLink, keeping the latest entry.
         */
        function removeDuplicateJobs(rawJobs) {
            if (!Array.isArray(rawJobs)) return [];

            const seenTitles = new Set();
            const seenLinks = new Set();
            const uniqueJobs = [];

            for (const job of rawJobs) {
                if (!job || !job.post) continue;

                // Normalize title (lowercase, trim, remove extra spaces)
                const normalizedTitle = job.post.toLowerCase().replace(/\s+/g, ' ').trim();
                const normalizedLink = (job.applyLink || '').toLowerCase().trim();

                // Skip if same title or same applyLink already exists
                if (seenTitles.has(normalizedTitle)) continue;
                if (normalizedLink && normalizedLink !== '#' && seenLinks.has(normalizedLink)) continue;

                seenTitles.add(normalizedTitle);
                if (normalizedLink && normalizedLink !== '#') {
                    seenLinks.add(normalizedLink);
                }

                uniqueJobs.push(job);
            }

            return uniqueJobs;
        }

        /**
         * Fetch latest jobs from jobs.json with cache-busting timestamp
         */
        async function fetchJobs() {
            try {
                // Cache-busting query string ensures fresh jobs.json is always fetched
                const response = await fetch(`jobs.json?t=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const rawData = await response.json();
                jobsData = removeDuplicateJobs(rawData);

                // Update live badge count dynamically
                liveCountBadge.textContent = `লাইভ আপডেট: ${jobsData.length}টি গুরুত্বপূর্ণ চাকরি (WB Govt, Central Govt., Private Sector)`;

                displayJobs(currentFilter, searchInput.value);
            } catch (error) {
                console.error('Error loading jobs.json:', error);
                jobGrid.innerHTML = `<p class="col-span-full text-center text-rose-600 py-10 font-semibold">ডেটা লোড করতে সমস্যা হয়েছে! অনুগ্রহ করে পেজটি রিফ্রেশ করুন।</p>`;
            }
        }

        /**
         * Render filtered jobs into the grid
         */
        function displayJobs(filter = 'all', searchQuery = '') {
            jobGrid.innerHTML = '';
            const query = searchQuery.trim().toLowerCase();

            const filtered = jobsData.filter(job => {
                const jobType = (job.type || '').trim();
                const matchesCategory = filter === 'all' || jobType === filter;

                const post = (job.post || '').toLowerCase();
                const org = (job.org || '').toLowerCase();
                const qualification = (job.qualification || '').toLowerCase();

                const matchesSearch = !query ||
                    post.includes(query) ||
                    org.includes(query) ||
                    qualification.includes(query);

                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                jobGrid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10">কোনো চাকরি পাওয়া যায়নি।</p>`;
                return;
            }

            filtered.forEach(job => {
                let badgeColor = job.type === 'WB Govt'
                    ? 'bg-emerald-100 text-emerald-800'
                    : job.type === 'Central Govt'
                        ? 'bg-indigo-100 text-indigo-800'
                        : 'bg-amber-100 text-amber-800';

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between";

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-md ${badgeColor}">${job.type || 'Other'}</span>
                            <span class="text-xs font-semibold text-slate-500">কোড: ${job.code || 'N/A'}</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 mb-1 leading-snug">${job.post || 'শিরোনাম নেই'}</h3>
                        <p class="text-sm font-medium text-blue-700 mb-3">${job.org || 'অজানা সংস্থা'}</p>
                        
                        <div class="space-y-1.5 text-sm text-slate-600 mb-4 border-t border-b border-slate-100 py-3">
                            <p><strong>শূন্যপদ:</strong> <span class="text-slate-900 font-semibold">${job.vacancies || 'Updating...'}</span></p>
                            <p><strong>শিক্ষাগত যোগ্যতা:</strong> ${job.qualification || 'উল্লেখ নেই'}</p>
                            <p><strong>আবেদনের শেষ তারিখ:</strong> <span class="text-rose-600 font-semibold">${job.lastDate || 'শীঘ্রই আপডেট হবে'}</span></p>
                        </div>
                    </div>
                    
                    <a href="${job.applyLink || '#'}" target="_blank" rel="noopener noreferrer"
                       class="block text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition text-sm">
                        আবেদন করুন (Apply Now) ➔
                    </a>
                `;
                jobGrid.appendChild(card);
            });
        }

        /**
         * Handle category filter buttons
         */
        function filterCategory(category, clickedBtn) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-slate-200', 'text-slate-700', 'hover:bg-slate-300');
            });

            if (clickedBtn) {
                clickedBtn.classList.remove('bg-slate-200', 'text-slate-700', 'hover:bg-slate-300');
                clickedBtn.classList.add('bg-blue-600', 'text-white');
            }

            displayJobs(currentFilter, searchInput.value);
        }

        searchInput.addEventListener('input', (e) => {
            displayJobs(currentFilter, e.target.value);
        });

        // Initial fetch call
        fetchJobs();
    </script>
</body>
</html>
